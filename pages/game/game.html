<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학기 중 취미 추천 | 게임</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="game">

  <div id="site-nav"></div>

  <main>
    <div class="container">

    <section id="game-title-section" style="padding: 3rem 0 1rem;">
      <h1 class="section-title" style="font-size: 2.5rem;">
        <span style="color: #4DB190;">이모티콘 취미</span> 맞추기
      </h1>

      <p class="section-subtitle">
        조합을 보고 어떤 학기 중 취미인지 맞춰보세요
      </p>
    </section>
<section id="cover-section">

  <div class="game-cover-card">

    <div class="cover-emoji">
      🎧📚🏃🎨🎮
    </div>

    <h2>이 취미가 뭘까? 🤔</h2>

    <div class="sample-quiz">
      🎧🚶🌙
    </div>

    <p class="sample-answer">
      정답은...? 게임에서 확인해보세요!
    </p>

    <div class="cover-info">
      <div>🎯 총 10문제</div>
      <div>🔥 연속 정답 보너스</div>
      <div>🏆 취미 마스터 도전</div>
    </div>

    <button class="btn" id="start-btn">
      🎮 게임 시작하기
    </button>

  </div>

</section>
      <section id="game-section" style="display:none; max-width:700px; margin:0.5rem auto 0;">
        <div class="game-header">
          <span>
            라운드 <strong id="round-num">1</strong> / <strong id="total-rounds">10</strong>
          </span>
          <span id="timer" class="timer">⏰ 10초</span>
          <span class="score">점수 <strong id="score">0</strong>점</span>
        </div>

        <div class="emoji-display">
          <div class="emoji-combo" id="emoji-combo"></div>
          <p class="emoji-question">이 조합은 어떤 취미일까요?</p>
        </div>

        <div class="choices" id="choices"></div>

        <div class="feedback" id="feedback">보기를 선택하면 정답·오답 피드백이 표시됩니다</div>

        <div class="game-actions">
          <button class="btn btn-outline" id="next-btn" style="display:none;">다음 라운드 →</button>
        </div>
      </section>

      <section id="result-section" style="display:none; max-width:700px; margin: 2rem auto 0;">
        <div class="game-result-box">
          <p class="result-grade-label">학기 중 취미 이해도</p>
          <h2 id="grade"></h2>
          <p class="result-score-text">
            총점 <strong id="final-score">0</strong>점 / <strong id="max-score">100+</strong>
          </p>
          <a href="/pages/form/form.html" class="btn" style="margin-top: 2rem; display: inline-block;">내 취미 찾으러 가기 →</a>
        </div>
      </section>

    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/shared/layout.js"></script>
  <script type="module" src="/pages/game/game.js"></script>
</body>
</html>
