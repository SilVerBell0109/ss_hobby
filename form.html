<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학기중 취미 추천 | 폼</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="nav">
    <div class="nav-container">
      <a href="main.html" class="nav-logo">학기중 취미</a>
      <ul class="nav-menu">
        <li><a href="main.html">메인</a></li>
        <li><a href="team.html">팀원소개</a></li>
        <li><a href="game.html">게임</a></li>
        <li><a href="form.html" class="active">폼</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">

    <section>
      <h1 class="section-title" style="font-size: 2rem;">너에게 맞는 학기중 취미 찾기</h1>
      <p class="section-subtitle">간단한 설문 후 5가지 중 하나의 취미가 추천됩니다</p>
    </section>

    <section class="form-container">

      <div class="form-group">
        <label class="form-label">Q1. 지금 스트레스 정도는?</label>
        <input type="range" min="0" max="10" value="5" class="form-range">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-light); margin-top: 0.3rem;">
          <span>편안함</span>
          <span>매우 지침</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Q2. 하루에 취미에 쓸 수 있는 시간은?</label>
        <div class="radio-group">
          <label class="radio-item"><input type="radio" name="time"> 10분</label>
          <label class="radio-item"><input type="radio" name="time"> 30분</label>
          <label class="radio-item"><input type="radio" name="time"> 1시간</label>
          <label class="radio-item"><input type="radio" name="time"> 그 이상</label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Q3. 지금 기분은?</label>
        <select class="form-select">
          <option>활기참</option>
          <option>평온함</option>
          <option>지침</option>
          <option>우울함</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Q4. 실내 vs 실외 어디가 좋아요?</label>
        <div class="radio-group">
          <label class="radio-item"><input type="radio" name="place"> 실내</label>
          <label class="radio-item"><input type="radio" name="place"> 실외</label>
          <label class="radio-item"><input type="radio" name="place"> 상관 없음</label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Q5. 혼자 vs 같이</label>
        <div class="radio-group">
          <label class="radio-item"><input type="radio" name="with"> 혼자</label>
          <label class="radio-item"><input type="radio" name="with"> 같이</label>
          <label class="radio-item"><input type="radio" name="with"> 둘 다 좋음</label>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-accent">추천 받기 →</button>
      </div>

      <div class="result-box">
        <p class="result-label">추천 결과 미리보기</p>
        <h2 class="result-hobby">너에게 맞는 취미</h2>
        <p class="result-from">추천인 : 팀원 N</p>
        <div class="result-tips">
          <strong>시작 가이드</strong><br>
          여기에 추천 취미를 학기중에 시작하는 방법과 꾸준히 하는 팁이 표시됩니다
        </div>
      </div>

    </section>

  </div>

  <footer class="footer">
    <p>© 2026 학기중 취미 추천 · 웹클라이언트컴퓨팅 01분반</p>
  </footer>

</body>
</html>
