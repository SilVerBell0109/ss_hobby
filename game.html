<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학기중 취미 추천 | 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="nav">
    <div class="nav-container">
      <a href="main.html" class="nav-logo">학기중 취미</a>
      <ul class="nav-menu">
        <li><a href="main.html">메인</a></li>
        <li><a href="team.html">팀원소개</a></li>
        <li><a href="game.html" class="active">게임</a></li>
        <li><a href="form.html">폼</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">

    <section>
      <h1 class="section-title" style="font-size: 2rem;">이모티콘 취미 맞추기</h1>
      <p class="section-subtitle">조합을 보고 어떤 학기중 취미인지 맞춰보세요</p>
    </section>

    <section style="max-width: 700px; margin: 2rem auto 0;">

      <div class="game-header">
        <span>라운드 <strong>3</strong> / 7</span>
        <span class="score">점수 20점</span>
      </div>

      <div class="emoji-display">
        <div class="emoji-combo">☕ 📖 🪴</div>
        <p class="emoji-question">이 조합은 어떤 취미일까요?</p>
      </div>

      <div class="choices">
        <button class="choice-btn">A. 카페에서 식물 키우기</button>
        <button class="choice-btn">B. 카페에서 독서</button>
        <button class="choice-btn">C. 홈카페 만들기</button>
        <button class="choice-btn">D. 식물 사진 찍기</button>
      </div>

      <div class="feedback">
        보기를 선택하면 정답·오답 피드백이 표시됩니다
      </div>

      <div class="game-actions">
        <button class="btn btn-outline">다음 라운드 →</button>
      </div>

    </section>

  </div>

  <footer class="footer">
    <p>© 2026 학기중 취미 추천 · 웹클라이언트컴퓨팅 01분반</p>
  </footer>

</body>
</html>
