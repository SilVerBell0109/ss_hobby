<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학기 중 취미 추천 | 폼</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="form">

  <div id="site-nav"></div>

  <main>
    <div class="container">

      <section style="padding: 3rem 0 1rem;">
        <h1 class="section-title" style="font-size: 2.5rem;">너에게 맞는 학기 중 취미 찾기</h1>
        <p class="section-subtitle">설문 후 팀원 추천 취미와 맞춤 취미를 함께 받아보세요</p>
      </section>

      <div class="form-progress-wrap">
        <div class="form-progress-bar">
            <div class="form-progress-fill" id="progress-fill"></div>
        </div>
        <span class="form-progress-label" id="progress-label">1 / 5 완료</span>
      </div>

      <form id="hobby-form" class="form-container">

        <div class="question-card form-group">
          <div class="question-num">Q1 · 컨디션</div>
          <label class="form-label" for="stress">
            지금 얼마나 지쳐있는 상태인가요?
            <strong id="stress-val" class="range-value">5</strong>
          </label>
          <p class="stress-desc" id="stress-desc">보통 수준의 피로도</p>
          <input type="range" id="stress" min="0" max="10" value="5" step="1" class="form-range">
          <div class="range-labels">
            <span>편안함</span>
            <span>매우 지침</span>
          </div>
        </div>
        
        <div class="question-card form-group">
          <div class="question-num">Q2 · 시간</div>
          <label class="form-label">하루에 취미에 쓸 수 있는 시간은 어느정도 되나요?</label>
          <div class="chip-group" id="time-chips">
            <button type="button" class="chip-btn" data-name="time" data-value="10분">⏱ 10분</button>
            <button type="button" class="chip-btn" data-name="time" data-value="30분">☕ 30분</button>
            <button type="button" class="chip-btn" data-name="time" data-value="1시간">🕐 1시간</button>
            <button type="button" class="chip-btn" data-name="time" data-value="그 이상">🌙 그 이상</button>
          </div>
          <input type="hidden" name="time" id="time-hidden">
        </div>

        <div class="question-card form-group">
          <div class="question-num">Q3 · 기분</div>
          <label class="form-label">지금 기분은 어떤가요?</label>
          <div class="chip-group" id="mood-chips">
            <button type="button" class="chip-btn" data-name="mood" data-value="활기참">⚡ 활기참</button>
            <button type="button" class="chip-btn" data-name="mood" data-value="평온함">😌 평온함</button>
            <button type="button" class="chip-btn" data-name="mood" data-value="지침">😓 지침</button>
            <button type="button" class="chip-btn" data-name="mood" data-value="우울함">🌧 우울함</button>
          </div>
          <input type="hidden" name="mood" id="mood-hidden">
        </div>

        <div class="question-card form-group">
          <div class="question-num">Q4 · 공간</div>
          <label class="form-label">실내 vs 실외 어디가 좋아요?</label>
          <div class="chip-group" id="place-chips">
            <button type="button" class="chip-btn" data-name="place" data-value="실내">🏠 실내</button>
            <button type="button" class="chip-btn" data-name="place" data-value="실외">🌿 실외</button>
            <button type="button" class="chip-btn" data-name="place" data-value="상관없음">✨ 상관 없음</button>
          </div>
          <input type="hidden" name="place" id="place-hidden">
        </div>

       <div class="question-card form-group">
          <div class="question-num">Q5 · 관계</div>
          <label class="form-label">혼자 vs 같이 뭐가 더 좋아요?</label>
          <div class="chip-group" id="social-chips">
            <button type="button" class="chip-btn" data-name="social" data-value="혼자">🎧 혼자</button>
            <button type="button" class="chip-btn" data-name="social" data-value="같이">👥 같이</button>
            <button type="button" class="chip-btn" data-name="social" data-value="둘다">🤝 둘 다</button>
          </div>
          <input type="hidden" name="social" id="social-hidden">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-accent">취미 추천 받기 →</button>
        </div>

      </form>

      <div id="result-box" class="result-box result-box--team" style="display:none;">
        <p class="result-section-label">팀원 추천</p>
        <div id="result-emoji" class="result-emoji"></div>
        <p class="result-label">추천 취미</p>
        <h2 class="result-hobby" id="result-hobby"></h2>
        <p class="result-from" id="result-from"></p>
        <div class="result-tips">
          <strong>시작 가이드</strong>
          <p id="result-guide" style="margin-top:0.5rem;"></p>
          <strong style="display:block; margin-top:1rem;">학기 중 꾸준히 하는 팁</strong>
          <p id="result-tip" style="margin-top:0.5rem;"></p>
        </div>
      </div>

      <section id="secondary-box" class="section form-secondary-section" style="display:none;">
        <h2 class="section-title" id="secondary-title">이런 취미는 어때요?</h2>
        <p class="section-subtitle" id="secondary-desc">카드를 눌러 시작 방법과 팁을 확인해보세요</p>
        <div id="secondary-list" class="preview-grid preview-grid--form"></div>
      </section>

    </div>
  </main>

  <div id="site-footer"></div>

  <div id="secondary-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <button type="button" class="modal-close" id="secondary-modal-close" aria-label="닫기">×</button>
      <div class="modal-emoji" id="secondary-modal-emoji"></div>
      <h2 class="modal-hobby-name" id="secondary-modal-name"></h2>
      <div class="modal-section">
        <p class="modal-section-label">어떻게 시작하나요?</p>
        <p id="secondary-modal-guide"></p>
      </div>
      <div class="modal-section">
        <p class="modal-section-label">학기 중 꿀팁</p>
        <p id="secondary-modal-tip"></p>
      </div>
    </div>
  </div>

  <script src="/shared/layout.js"></script>
  <script type="module" src="/pages/form/form.js"></script>
</body>
</html>
