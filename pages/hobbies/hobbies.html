<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학기 중 취미 추천 | 취미도감</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="hobbies">

  <div id="site-nav"></div>

  <section class="hero hero--sub">
    <h1>취미도감</h1>
    <p>카드를 눌러 시작 방법과 팁을 확인해보세요</p>
  </section>

  <div class="container">

    <div class="hobbies-toolbar">
      <div class="chip-group hobbies-filter" id="hobbies-filter">
        <button type="button" class="chip-btn selected" data-filter="all">전체</button>
        <button type="button" class="chip-btn" data-filter="semester">학기 추천</button>
        <button type="button" class="chip-btn" data-filter="team">팀 추천</button>
      </div>
      <div class="hobbies-toolbar-meta">
        <p class="hobbies-legend">
          <span class="hobby-badge hobby-badge--semester">★</span>
          <span>학기 추천 점수</span>
          <span class="hobbies-legend-sep" aria-hidden="true">·</span>
          <span class="hobby-badge hobby-badge--team">팀</span>
          <span>팀원이 소개한 취미</span>
        </p>
        <p class="hobbies-count" id="hobbies-count" aria-live="polite"></p>
      </div>
    </div>

    <div class="preview-grid preview-grid--hobbies" id="hobbies-grid"></div>
    <p class="hobbies-empty" id="hobbies-empty" style="display:none;">조건에 맞는 취미가 없어요.</p>

  </div>

  <div id="site-footer"></div>

  <div id="hobby-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <button type="button" class="modal-close" id="modal-close" aria-label="닫기">×</button>
      <div class="modal-emoji" id="modal-emoji"></div>
      <h2 class="modal-hobby-name" id="modal-hobby-name"></h2>
      <div class="modal-hobby-meta" id="modal-hobby-meta"></div>
      <div class="modal-section">
        <p class="modal-section-label">어떻게 시작하나요?</p>
        <p id="modal-guide"></p>
      </div>
      <div class="modal-section">
        <p class="modal-section-label">학기 중 꿀팁</p>
        <p id="modal-tip"></p>
      </div>
    </div>
  </div>

  <script src="/shared/layout.js"></script>
  <script type="module" src="/pages/hobbies/hobbies.js"></script>
</body>
</html>
