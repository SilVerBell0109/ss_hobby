<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학기 중 취미 추천 | 팀원 소개</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="team">

  <div id="site-nav"></div>

  <div class="container">

    <section style="padding: 3rem 0 1rem;">
      <h1 class="section-title" style="color:#4DB190;">생존자 인터뷰</h1>
      <p class="section-subtitle">
        "어떻게 버티셨어요?"에 대한 진솔한 답변들
      </p>
    </section>

    <section class="team-grid" id="team-grid"></section>

  </div>

  <div id="site-footer"></div>

  <div id="hobby-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <button class="modal-close" id="modal-close">×</button>
      <div class="modal-emoji" id="modal-emoji"></div>
      <h2 class="modal-hobby-name" id="modal-hobby-name"></h2>
      <p class="modal-recommender" id="modal-recommender"></p>
      <div class="modal-section">
        <p class="modal-section-label">입문 가이드</p>
        <p id="modal-guide"></p>
      </div>
      <div class="modal-section">
        <p class="modal-section-label">이 취미의 생존 팁</p>
        <p id="modal-tip"></p>
      </div>
      <div id="modal-hobby-photos" class="modal-hobby-photos" style="display:none;"></div>
    </div>
  </div>

  <script src="/shared/layout.js"></script>
  <script type="module" src="/pages/team/team.js"></script>
</body>
</html>
